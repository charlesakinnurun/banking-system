name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: banking
          POSTGRES_DB: banking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banking -d banking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Integration tests use this instead of booting an embedded database.
      TEST_DATABASE_URL: postgres://banking:banking@localhost:5432/banking_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit + integration + invariant + concurrency + security tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate OpenAPI document
        run: npm run openapi

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high
